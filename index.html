<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:linear-gradient(135deg,#ffdde1,#ee9ca7);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:Poppins,sans-serif;
}

#envelope{

cursor:pointer;
text-align:center;
transition:1s;
animation:float 2s ease-in-out infinite;

}

.letter{

width:180px;
height:120px;
background:white;
margin:auto;
border-radius:8px;
position:relative;
box-shadow:0 20px 50px rgba(0,0,0,.2);

}

.letter:before{

content:'';
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
clip-path:polygon(0 0,50% 50%,100% 0);
background:#f8b7c5;

}

.tap{

margin-top:25px;
font-size:20px;
color:white;
font-weight:bold;
animation:pulse 1s infinite;

}

#main{

position:absolute;
text-align:center;
opacity:0;
transform:scale(.7);

}

h2{

font-size:32px;
color:white;
letter-spacing:3px;

}

h1{

font-family:"Great Vibes";
font-size:95px;
color:white;
text-shadow:0 0 20px white;
animation:glow 2s infinite alternate;

}

p{

color:white;
font-size:20px;
margin-top:15px;

}

.show{

animation:show 2s forwards;

}

.hide{

opacity:0;
transform:scale(.2) rotate(720deg);

}

@keyframes show{

to{

opacity:1;
transform:scale(1);

}

}

@keyframes glow{

from{

text-shadow:0 0 10px white;

}

to{

text-shadow:0 0 30px #fff,
0 0 60px pink;

}

}

@keyframes float{

50%{

transform:translateY(-15px);

}

}

@keyframes pulse{

50%{

transform:scale(1.1);

}

}

</style>

</head>

<body>

<div id="envelope">

<div class="letter"></div>

<div class="tap">
👇 Ketuk Surat 👇
</div>

</div>

<div id="main">

<h2>💍 Pernikahan Virtual 💍</h2>

<h1>NOEL & ELLA</h1>

<p>Selamat Datang di Undangan Pernikahan Virtual</p>

</div>

<script>

const env=document.getElementById("envelope");
const main=document.getElementById("main");

env.onclick=()=>{

confetti({

particleCount:250,

spread:180,

origin:{y:.6}

});

setTimeout(()=>{

confetti({

particleCount:200,

angle:60,

origin:{x:0}

});

confetti({

particleCount:200,

angle:120,

origin:{x:1}

});

},300);

env.classList.add("hide");

setTimeout(()=>{

env.style.display="none";

main.classList.add("show");

},900);

}

</script>

</body>
  </html>
