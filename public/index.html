<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebCracker Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080b17;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      color: #e8edf5;
    }
    .container {
      max-width: 1000px;
      width: 100%;
      background: rgba(12,18,34,0.85);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      padding: 2.5rem;
      border: 1px solid rgba(0,245,212,0.15);
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00f5d4, #00b8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 i { -webkit-text-fill-color: initial; color: #00f5d4; }
    .badge {
      background: rgba(0,245,212,0.12);
      border: 1px solid rgba(0,245,212,0.25);
      border-radius: 40px;
      padding: 0.4rem 1.2rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #00f5d4;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge i { font-size: 0.5rem; color: #00f5d4; }
    .subtitle {
      color: #7b8ab0;
      font-size: 0.95rem;
      border-left: 3px solid #00f5d4;
      padding-left: 1.2rem;
      margin-bottom: 2rem;
    }
    .input-area {
      background: rgba(0,0,0,0.3);
      border-radius: 60px;
      padding: 0.4rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      border: 1px solid #1e2a45;
      margin-bottom: 2rem;
    }
    .input-area:focus-within {
      border-color: #00f5d4;
      box-shadow: 0 0 0 4px rgba(0,245,212,0.08);
    }
    .input-area input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.9rem 1.8rem;
      font-size: 1rem;
      color: #e8edf5;
      outline: none;
      min-width: 200px;
    }
    .input-area input::placeholder { color: #4a5a7a; }
    .input-area button {
      background: linear-gradient(135deg, #00f5d4, #0099ff);
      border: none;
      border-radius: 60px;
      padding: 0.8rem 2.2rem;
      font-weight: 700;
      font-size: 0.95rem;
      color: #080b17;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-area button:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(0,245,212,0.3);
    }
    .input-area button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      background: #0b0f1c;
      border-radius: 16px;
      padding: 1.2rem 1.8rem;
      min-height: 60px;
      border: 1px solid #1a233a;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      color: #7b8ab0;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .status .highlight { color: #00f5d4; }
    .status .error { color: #ff6b6b; }
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
      margin-top: 0.5rem;
    }
    .file-card {
      background: #111827;
      border-radius: 16px;
      padding: 1.2rem 1rem;
      border: 1px solid #1f2a44;
      text-align: center;
      transition: 0.2s;
    }
    .file-card:hover { border-color: #00f5d4; transform: translateY(-3px); }
    .file-card i { font-size: 2rem; color: #00f5d4; margin-bottom: 8px; }
    .file-card .name { font-weight: 500; font-size: 0.8rem; word-break: break-all; color: #ccd6f6; }
    .file-card .size { font-size: 0.7rem; color: #6b7a9f; margin-top: 4px; }
    .file-card .download-btn {
      margin-top: 10px;
      background: #1f2a44;
      border: none;
      border-radius: 30px;
      padding: 6px 16px;
      color: #ccd6f6;
      font-size: 0.7rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .file-card .download-btn:hover { background: #2f3d64; color: #fff; }
    .loader {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid #1f2a44;
      border-radius: 50%;
      border-top: 3px solid #00f5d4;
      animation: spin 0.9s linear infinite;
      vertical-align: middle;
      margin-right: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #3d4a68;
      text-align: center;
      border-top: 1px solid #1a233a;
      padding-top: 1.5rem;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="fas fa-skull"></i> WebCracker</h1>
    <span class="badge"><i class="fas fa-circle"></i> ONLINE</span>
  </div>
  <div class="subtitle">Pentest engine — backend exploit, multi‑vector</div>

  <div class="input-area">
    <input type="text" id="target" placeholder="https://target-website.com" value="https://example.com" />
    <button id="scanBtn"><i class="fas fa-bolt"></i> Scan</button>
  </div>

  <div class="status" id="status">
    <span class="highlight">➜</span> Ready — masukkan link target, klik Scan.
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
    <span style="font-weight:600;"><i class="fas fa-file-code" style="color:#00f5d4; margin-right:10px;"></i>Hasil</span>
    <span style="font-size:0.8rem; color:#6b7a9f;" id="fileCount">0 files</span>
  </div>
  <div id="fileGrid" class="file-grid">
    <div style="grid-column:1/-1; text-align:center; color:#3d4a68; padding:1.5rem;">Belum ada hasil scan.</div>
  </div>

  <div class="footer">⚡ <strong>BARA TO INTERNASIONAL</strong> — for authorized security research only.</div>
</div>

<script>
  const targetInput = document.getElementById('target');
  const scanBtn = document.getElementById('scanBtn');
  const statusDiv = document.getElementById('status');
  const fileGrid = document.getElementById('fileGrid');
  const fileCount = document.getElementById('fileCount');
  let filesData = [];

  function setStatus(msg, isError = false) {
    const icon = isError ? '❌' : '➜';
    const cls = isError ? 'error' : 'highlight';
    statusDiv.innerHTML = `<span class="${cls}">${icon}</span> ${msg}`;
  }

  function renderFiles(files) {
    filesData = files || [];
    if (!filesData.length) {
      fileGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#3d4a68; padding:1.5rem;">Belum ada hasil scan.</div>`;
      fileCount.innerText = '0 files';
      return;
    }
    let html = '';
    filesData.forEach((f, idx) => {
      const icon = f.name.endsWith('.js') ? 'fa-brands fa-js' :
                   f.name.endsWith('.py') ? 'fa-brands fa-python' :
                   f.name.endsWith('.sql') ? 'fa-solid fa-database' :
                   f.name.endsWith('.json') ? 'fa-solid fa-code' :
                   f.name.endsWith('.zip') ? 'fa-solid fa-file-zipper' :
                   'fa-solid fa-file';
      html += `
        <div class="file-card">
          <div><i class="${icon}"></i></div>
          <div class="name">${f.name}</div>
          <div class="size">${f.size || '0 KB'}</div>
          <button class="download-btn" data-index="${idx}"><i class="fas fa-download"></i> Download</button>
        </div>
      `;
    });
    fileGrid.innerHTML = html;
    fileCount.innerText = filesData.length + ' files';

    document.querySelectorAll('.download-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const idx = parseInt(this.dataset.index);
        const file = filesData[idx];
        if (!file) return;
        const blob = new Blob([file.content || '// content'], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    });
  }

  async function scan() {
    const url = targetInput.value.trim();
    if (!url || !url.startsWith('http')) {
      setStatus('Masukkan URL valid (contoh: https://example.com)', true);
      return;
    }

    scanBtn.disabled = true;
    scanBtn.innerHTML = '<span class="loader"></span> Scanning...';
    setStatus(`Scanning ${url} ... (multi-vector exploit)`);

    try {
      const res = await fetch('/api/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: url })
      });

      const data = await res.json();

      if (data.error) {
        setStatus(`Error: ${data.error}`, true);
        return;
      }

      setStatus(`✅ ${data.message}`);
      renderFiles(data.files);

    } catch (err) {
      setStatus(`Error: ${err.message}`, true);
    } finally {
      scanBtn.disabled = false;
      scanBtn.innerHTML = '<i class="fas fa-bolt"></i> Scan';
    }
  }

  scanBtn.addEventListener('click', scan);
  targetInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') scan();
  });

  renderFiles([]);
  setStatus('Ready — masukkan link target, klik Scan.');
</script>
</body>
</html>
